<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flutter Notes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 引入 docsify 样式: vue.css 是默认主题，dark.css 是暗黑主题 -->
  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
  />
  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
    media="(prefers-color-scheme: dark)"
  />

  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/dark.css" disabled /> -->

</head>
<body class="sidebar-chevron-right">
  <div id="app"></div>
  <script>
    // 配置 docsify，这些属性的含义可以在 docsify 官网查看
    window.$docsify = {
      auto2top: true,  // 开启自动滚动到顶部
      coverpage: true,  // 开启封面
      loadSidebar: true,  // 开启侧边栏
      subMaxLevel: 2,  // 最大子标题层级
      name: 'Flutter Notes',
      repo: ''
    }
  </script>
  <!-- Docsify v5 -->
  <!-- <script src="//cdn.jsdelivr.net/npm/docsify@4"></script> -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>


  <!-- 在index.html中添加代码高亮的配置 -->
  <!-- 去这个网站找：https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/ -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-swift.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-dart.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>

  <!-- 在index.html中添加一键拷贝代码的配置 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- 缩放插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom.min.js"></script>

  <!-- 解析emoji显示 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/emoji.min.js"></script>
  
</body>
</html>
